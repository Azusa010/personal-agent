[project]
name = "personal_agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Azusa", email = "m3171470760@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "openai>=3.6.0",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pypdf>=5.0.0",
    "tiktoken>=0.14.0",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
personal_agent = "personal_agent:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["personal_agent"]
