[project]
name = "personal_agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Azusa", email = "m3171470760@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["openai>=3.6.0", "pydantic>=2.13.5"]

[project.scripts]
personal_agent = "personal_agent:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.16.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
